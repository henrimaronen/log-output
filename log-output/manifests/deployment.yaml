apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-logs
          persistentVolumeClaim:
            claimName: image-claim
      containers:
        - name: log-writer
          image: henronen/log-output:2.0
          args: ["dist/writer.js"]
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files
        - name: log-reader
          image: henronen/log-output:2.0
          args: ["dist/reader.js"]
          env:
            - name: PORT
              value: "8888"
          ports:
            - containerPort: 8888
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8888
            periodSeconds: 5
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files