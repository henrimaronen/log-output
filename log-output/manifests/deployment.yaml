apiVersion: apps/v1
kind: Deployment # type of resource
metadata:
  name: log-output # name of the resource
spec:
  replicas: 1 # number of replicas to create
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      containers:
        - name: log-output
          image: henronen/log-output:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8888"
          ports:
            - containerPort: 8888
