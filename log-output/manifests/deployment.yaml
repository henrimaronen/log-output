apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-logs
          persistentVolumeClaim:
            claimName: log-output-claim
        - name: config
          configMap:
            name: log-output-config
            items:
              - key: information.txt
                path: information.txt

      containers:
        - name: log-writer
          image: henronen/log-output:2.7
          args: ["dist/writer.js"]
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files
        - name: log-reader
          image: henronen/log-output:2.7
          args: ["dist/reader.js"]
          env:
            - name: PORT
              value: "8888"
            - name: PING_PONG_URL
              value: "http://ping-pong-svc:2345"
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: log-output-config
                  key: MESSAGE
          ports:
            - containerPort: 8888
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8888
            periodSeconds: 5
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files
            - name: config
              mountPath: /usr/src/app/config
              readOnly: true