apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes:
        - name: shared-files
          persistentVolumeClaim:
            claimName: shared-claim
      containers:
        - name: ping-pong
          image: henronen/ping-pong:1.1
          volumeMounts:
            - name: shared-files
              mountPath: /usr/src/app/files
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8889"
          ports:
            - containerPort: 8889
