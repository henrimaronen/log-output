apiVersion: apps/v1
kind: Deployment
metadata:
  name: the-project
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: the-project
  template:
    metadata:
      labels:
        app: the-project
    spec:
      volumes:
        - name: shared-files
          persistentVolumeClaim:
            claimName: the-project-claim
      containers:
        - name: the-project
          image: henronen/the-project:1.9
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: the-project-config
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: shared-files
              mountPath: /app/files
              subPath: the-project
