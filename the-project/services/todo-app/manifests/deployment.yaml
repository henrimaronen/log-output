apiVersion: apps/v1
kind: Deployment
metadata:
  name: the-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: the-project
  template:
    metadata:
      labels:
        app: the-project
    spec:
      volumes:
        - name: shared-files
          persistentVolumeClaim:
            claimName: shared-claim
      containers:
        - name: the-project
          image: henronen/the-project:1.8
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "9000"
            - name: IMAGE_DIR
              value: /app/files
            - name: TODO_BACKEND_URL
              value: http://todo-backend-svc:3000 # Todo backend application service address. 
            - name: TODOS_FORM_ACTION
              value: /todos
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: shared-files
              mountPath: /app/files
              subPath: the-project
