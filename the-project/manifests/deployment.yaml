apiVersion: apps/v1
kind: Deployment
metadata:
  name: the-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: the-project
  template:
    metadata:
      labels:
        app: the-project
    spec:
      containers:
        - name: the-project
          image: henronen/the-project:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "9000"
          ports:
            - containerPort: 9000
